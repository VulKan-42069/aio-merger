[package]
name = "aio-merger"
version = "1.0.0"
description = "Merge any mix of songs and videos into a single MP3 or MP4"
authors = ["AIO Merger"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "aio_merger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "time", "fs", "macros"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
