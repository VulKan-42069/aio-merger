<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIO Merger</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Title bar -->
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7c4 0 5 5 9 5M4 17c4 0 5-5 9-5M4 12h9"/><path d="M14 8l5 4-5 4z" class="fill"/></svg>
      <span data-tauri-drag-region>AIO Merger</span>
    </div>
    <div class="tool-error" id="toolStatus" hidden></div>
    <div class="window-controls">
      <button class="wc" id="wcMin" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button class="wc" id="wcMax" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button class="wc wc-close" id="wcClose" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <main class="app">
    <!-- Clips -->
    <section class="clips-pane" aria-label="Clips">
      <div class="pane-head">
        <div>
          <h1>Clips</h1>
          <p class="summary" id="summary"></p>
        </div>
        <div class="head-actions">
          <button class="btn" id="btnAddFiles" title="Add files (Ctrl+O)">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add
          </button>
          <div class="menu-wrap">
            <button class="btn btn-icon" id="btnMore" aria-haspopup="menu" aria-label="More">
              <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
            </button>
            <div class="menu" id="moreMenu" role="menu" hidden>
              <button role="menuitem" data-act="link">Add from link…</button>
              <button role="menuitem" data-act="folder">Add folder…</button>
              <hr />
              <button role="menuitem" data-act="name">Sort by name</button>
              <button role="menuitem" data-act="duration">Sort by length</button>
              <button role="menuitem" data-act="reverse">Reverse order</button>
              <hr />
              <button role="menuitem" data-act="clear" class="danger">Remove all</button>
            </div>
          </div>
        </div>
      </div>

      <div class="list-wrap" id="listWrap">
        <button class="empty" id="emptyState">
          <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          <strong>Drop songs or videos here</strong>
          <span>or click to browse · paste a YouTube link</span>
        </button>
        <ol class="clips" id="clipList" aria-label="Clips in order"></ol>
        <div class="probing" id="probing" hidden><span class="spinner"></span><span id="probingText">Reading…</span></div>
      </div>
    </section>

    <!-- Output settings -->
    <aside class="deck" aria-label="Output">
      <div class="deck-scroll">
        <div class="format-switch" role="radiogroup" aria-label="Output format">
          <button class="format-tile" role="radio" data-format="mp3">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            <span class="ft-name">MP3</span>
            <span class="ft-desc">Audio</span>
          </button>
          <button class="format-tile" role="radio" data-format="mp4">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="14" height="14" rx="2.5"/><path d="M16.5 10l5-3v10l-5-3"/></svg>
            <span class="ft-name">MP4</span>
            <span class="ft-desc">Video</span>
          </button>
        </div>

        <section class="group" data-show="mp4">
          <h3>Title card</h3>
          <div class="preview"><canvas id="cardPreview" width="640" height="360"></canvas></div>
          <div class="templates" id="templateList" role="radiogroup" aria-label="Title card template"></div>
          <div class="row">
            <span class="row-label">Accent</span>
            <div class="swatches" id="accentList" role="radiogroup" aria-label="Accent colour"></div>
          </div>
          <label class="row toggle-row">
            <span class="row-label">Waveform</span>
            <input type="checkbox" class="switch" id="optWave" />
          </label>
        </section>

        <section class="group" data-show="mp4">
          <h3>Video</h3>
          <div class="row stack">
            <span class="row-label">Size</span>
            <div class="seg" id="optRes" role="radiogroup">
              <button data-v="1280x720">720p</button>
              <button data-v="1920x1080">1080p</button>
              <button data-v="2560x1440">1440p</button>
              <button data-v="1080x1080">1:1</button>
              <button data-v="1080x1920">9:16</button>
            </div>
          </div>
          <div class="row stack">
            <span class="row-label">Fit</span>
            <div class="seg" id="optFit" role="radiogroup">
              <button data-v="blur">Blur</button>
              <button data-v="letterbox">Letterbox</button>
              <button data-v="crop">Crop</button>
            </div>
          </div>
          <div class="row">
            <span class="row-label">Frame rate</span>
            <div class="seg seg-sm" id="optFps" role="radiogroup">
              <button data-v="24">24</button><button data-v="30">30</button><button data-v="60">60</button>
            </div>
          </div>
        </section>

        <section class="group">
          <h3>Audio</h3>
          <div class="row">
            <span class="row-label">Bitrate</span>
            <div class="seg seg-sm" id="optBitrate" role="radiogroup">
              <button data-v="128">128</button><button data-v="192">192</button><button data-v="256">256</button><button data-v="320">320</button>
            </div>
          </div>
          <div class="row">
            <span class="row-label">Sample rate</span>
            <div class="seg seg-sm" id="optRate" role="radiogroup">
              <button data-v="44100">44.1k</button><button data-v="48000">48k</button>
            </div>
          </div>
        </section>

        <details class="group advanced">
          <summary><h3>Advanced</h3><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary>
          <div class="row stack" data-show="mp4">
            <span class="row-label">Encoder</span>
            <div class="seg" id="optEncoder" role="radiogroup"></div>
          </div>
          <div class="row stack" data-show="mp4">
            <span class="row-label">Quality</span>
            <div class="seg" id="optQuality" role="radiogroup">
              <button data-v="high">High</button><button data-v="balanced">Balanced</button><button data-v="small">Small</button>
            </div>
          </div>
          <label class="row toggle-row">
            <span class="row-label">Skip re-encoding when possible</span>
            <input type="checkbox" class="switch" id="optSmart" />
          </label>
          <label class="row toggle-row">
            <span class="row-label">Chapter markers</span>
            <input type="checkbox" class="switch" id="optChapters" />
          </label>
        </details>
      </div>

      <div class="deck-foot">
        <div class="dest">
          <label class="dest-name">
            <span class="sr-only">File name</span>
            <input id="outName" spellcheck="false" autocomplete="off" />
            <span class="dest-ext" id="outExt">.mp4</span>
          </label>
          <button class="btn btn-icon" id="btnDest" title="Save to…">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </button>
        </div>
        <p class="dest-path" id="outDir"></p>
        <button class="merge" id="btnMerge" disabled>
          <span id="mergeLabel">Merge</span>
          <span class="merge-sub" id="mergeSub"></span>
        </button>
      </div>
    </aside>
  </main>

  <div class="dropzone" id="dropzone" hidden><div>Drop to add</div></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="state" id="stateRun">
        <div class="run-top"><span id="runStage">Preparing</span><span class="run-pct"><span id="runPercent">0</span>%</span></div>
        <div class="run-bar"><div class="run-fill" id="runFill"></div></div>
        <p class="run-detail" id="runDetail"></p>
        <div class="run-foot">
          <span><span id="runIndex">0 / 0</span> · <span id="runEta">—</span> left</span>
          <button class="btn btn-ghost" id="btnCancel">Cancel</button>
        </div>
      </div>

      <div class="state" id="stateDone" hidden>
        <div class="done-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 id="modalTitle">Done</h2>
        <p class="done-file" id="doneFile"></p>
        <p class="done-stats" id="doneStats"></p>
        <div class="done-actions">
          <button class="btn btn-primary" id="btnPlay">Open</button>
          <button class="btn" id="btnReveal">Show in folder</button>
          <button class="btn btn-ghost" id="btnDoneClose">Close</button>
        </div>
      </div>

      <div class="state" id="stateLink" hidden>
        <h2 class="link-title">Add from link</h2>
        <input id="linkInput" class="link-input" placeholder="Paste a YouTube video or playlist link" spellcheck="false" autocomplete="off" />
        <div class="row">
          <span class="row-label">Download as</span>
          <div class="seg seg-sm" id="linkMode" role="radiogroup">
            <button data-v="audio">Song</button><button data-v="video">Video</button>
          </div>
        </div>
        <div class="link-folder">
          <span class="link-note" id="linkNote"></span>
          <button class="link-btn" id="btnDlOpen">Open</button>
          <button class="link-btn" id="btnDlChange">Change</button>
        </div>
        <div class="done-actions end">
          <button class="btn btn-ghost" id="btnLinkCancel">Cancel</button>
          <button class="btn btn-primary" id="btnLinkAdd">Add</button>
        </div>
      </div>

      <div class="state" id="stateError" hidden>
        <h2>Merge failed</h2>
        <pre class="err-log" id="errLog"></pre>
        <div class="done-actions"><button class="btn btn-primary" id="btnErrClose">Close</button></div>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
